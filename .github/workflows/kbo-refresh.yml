name: Refresh KBO data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/crawl_kbo.py'
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Refresh KBO snapshot
        run: python scripts/crawl_kbo.py

      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/kbo-data.json
          git diff --cached --quiet || git commit -m "Refresh KBO data"
          git push
