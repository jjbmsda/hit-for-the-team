name: Refresh KBO data

on:
  push:
    branches: [main]
    paths:
      - 'scripts/crawl_kbo.py'
      - 'scripts/enrich_players.py'
      - '.github/workflows/kbo-refresh.yml'
  schedule:
    - cron: '0 15 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: kbo-refresh-main
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh KBO snapshot
        run: python scripts/crawl_kbo.py

      - name: Enrich positions and player profiles
        run: python scripts/enrich_players.py

      - name: Commit refreshed data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dist/kbo-data.json
          if git diff --cached --quiet; then
            echo 'No data changes'
            exit 0
          fi
          git commit -m "Refresh KBO data"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
